name: Deploy GitHub Pages

# Builds the site from src/ and site-references/ and publishes docs/ to GitHub Pages.
# Runs on every push to main, so merging a PR or editing site-references/for-sale/menu.json on main goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.py reads each page's last commit date for lastmod and dateModified
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 build.py
      - run: python3 tools/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
