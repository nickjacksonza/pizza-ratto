<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="{{ robots }}">
<link rel="canonical" href="{{ canonical }}">
<meta name="theme-color" content="{{ theme_color }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ og_locale }}">
<meta property="og:site_name" content="{{ name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Pizza Ratto hand-painted logo beside Remi the rat on a Vespa">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ og_image }}">
<link rel="icon" href="{{ root }}images/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ root }}images/brand/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="{{ root }}fonts/heathfield-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ root }}fonts/headland-one-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ root }}fonts/shrikhand-latin.woff2" crossorigin>
{{ hero_preload }}
<style>{{ css }}</style>
{{ analytics }}
<script type="application/ld+json">{{ jsonld }}</script>
</head>
